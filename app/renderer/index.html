<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:8420">
<title>AURA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="grid"></div>

  <div id="clock">--:--:--</div>

  <button id="toggle-projects" class="edge-tab edge-tab-left" type="button">Projets</button>
  <aside id="panel-projects" class="side-panel side-panel-left">
    <h2>Tâches</h2>
    <div id="tasks-list" class="muted small custom-scroll">Aucune tâche.</div>
    <form id="task-form" class="inline-form">
      <input id="task-title" type="text" placeholder="Nouvelle tâche…">
      <input id="task-due" type="date" title="Échéance">
      <select id="task-priority" title="Priorité">
        <option value="basse">Basse</option>
        <option value="moyenne" selected>Moyenne</option>
        <option value="haute">Haute</option>
      </select>
      <button type="submit">+</button>
    </form>

    <h3>Rappels</h3>
    <div id="reminders-list" class="muted small custom-scroll">Aucun rappel.</div>
    <form id="reminder-form" class="inline-form">
      <input id="reminder-text" type="text" placeholder="Rappel…">
      <input id="reminder-at" type="datetime-local">
      <select id="reminder-recurring" title="Récurrence">
        <option value="">Une fois</option>
        <option value="daily">Chaque jour</option>
        <option value="weekly">Chaque semaine</option>
      </select>
      <button type="submit">+</button>
    </form>
  </aside>

  <button id="toggle-context" class="edge-tab edge-tab-right" type="button">Activité</button>
  <aside id="panel-context" class="side-panel side-panel-right">
    <h2>Activité</h2>

    <div class="filter-label">Statut</div>
    <div id="journal-filters" class="filter-tabs">
      <button type="button" class="filter-btn active" data-filter-type="statut" data-filter="tous">Tout</button>
      <button type="button" class="filter-btn" data-filter-type="statut" data-filter="execute">Succès</button>
      <button type="button" class="filter-btn" data-filter-type="statut" data-filter="echoue">Erreurs</button>
    </div>
    <div class="filter-label">Sensibilité</div>
    <div id="journal-filters-sensibilite" class="filter-tabs">
      <button type="button" class="filter-btn active" data-filter-type="sensibilite" data-filter="tous">Tout</button>
      <button type="button" class="filter-btn" data-filter-type="sensibilite" data-filter="lecture">Lecture</button>
      <button type="button" class="filter-btn" data-filter-type="sensibilite" data-filter="reversible">Réversible</button>
    </div>
    <div id="journal-list" class="muted custom-scroll">Aucune action enregistrée pour l’instant.</div>
  </aside>

  <main id="stage">
    <div id="web"></div>
  </main>

  <div id="estop-banner" hidden>
    <span class="estop-dot"></span> AURA EN PAUSE — ARRÊT D’URGENCE ACTIF — toile et conversation gelées
  </div>

  <button id="estop" type="button" title="Arrêt d’urgence global">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9" />
    </svg>
    <span id="estop-label" class="sr-only">ARRÊT D’URGENCE</span>
  </button>

  <div id="conversation-panel">
    <!-- Bouton d'acces vers la future page/module Conversation - n'ouvre
         rien pour l'instant (ce module n'existe pas encore), volontairement
         inerte tant que le systeme de pages/modules n'est pas construit. -->
    <button id="conversation" type="button" class="conversation-bubble">
      <span class="conversation-bubble-text">Écrire un message...</span>
      <span class="conversation-bubble-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 11.5 21 3l-6.5 18-3-7.5L3 11.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="globe-stellaire.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
