<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://127.0.0.1:8420">
<title>AURA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="grid"></div>

  <div id="clock">--:--:--</div>

  <button id="toggle-projects" class="edge-tab edge-tab-left" type="button">Projets</button>
  <aside id="panel-projects" class="side-panel side-panel-left">
    <h2>Tâches</h2>
    <div id="tasks-list" class="muted small">Aucune tâche.</div>
    <form id="task-form" class="inline-form">
      <input id="task-title" type="text" placeholder="Nouvelle tâche…">
      <input id="task-due" type="date" title="Échéance">
      <select id="task-priority" title="Priorité">
        <option value="basse">Basse</option>
        <option value="moyenne" selected>Moyenne</option>
        <option value="haute">Haute</option>
      </select>
      <button type="submit">+</button>
    </form>

    <h3>Rappels</h3>
    <div id="reminders-list" class="muted small">Aucun rappel.</div>
    <form id="reminder-form" class="inline-form">
      <input id="reminder-text" type="text" placeholder="Rappel…">
      <input id="reminder-at" type="datetime-local">
      <select id="reminder-recurring" title="Récurrence">
        <option value="">Une fois</option>
        <option value="daily">Chaque jour</option>
        <option value="weekly">Chaque semaine</option>
      </select>
      <button type="submit">+</button>
    </form>
  </aside>

  <button id="toggle-context" class="edge-tab edge-tab-right" type="button">Journal<span id="context-alert-dot" class="alert-dot" hidden></span></button>
  <aside id="panel-context" class="side-panel side-panel-right">
    <h2>Journal</h2>

    <h3>Fournisseurs IA</h3>
    <div id="provider-list"></div>

    <h3>Activité</h3>
    <div id="journal-list" class="muted">Aucune action enregistrée pour l’instant.</div>
  </aside>

  <main id="stage">
    <svg id="web" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"></svg>
  </main>

  <div id="estop-banner" hidden>
    <span class="estop-dot"></span> AURA EN PAUSE — ARRÊT D’URGENCE ACTIF — toile et conversation gelées
  </div>

  <button id="estop" type="button" title="Arrêt d’urgence global">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1 0 12.728 0M12 3v9" />
    </svg>
    <span id="estop-label" class="sr-only">ARRÊT D’URGENCE</span>
  </button>

  <div id="conversation-panel">
    <div id="thread" aria-live="polite"></div>

    <form id="setup-key" hidden>
      <input id="api-key" type="password" placeholder="Colle ta clé API Anthropic (sk-ant-...)" autocomplete="off">
      <button id="save-key" type="submit">Enregistrer</button>
    </form>

    <form id="conversation">
      <input id="message" type="text" placeholder="Écrire un message..." autocomplete="off">
      <button id="send" type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 11.5 21 3l-6.5 18-3-7.5L3 11.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
